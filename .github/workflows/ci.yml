name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Unity 라이선스 없이 도는 CI다.
#
# 처음에는 game-ci로 Unity EditMode 테스트를 돌리려 했지만, Unity Personal 라이선스는
# .ulf 안에 MAC 주소와 머신 ID가 박힌 하드웨어 바인딩 방식이라 실행마다 새로 만들어지는
# GitHub 러너에서는 활성화되지 않는다. 자체 호스팅 러너는 공개 저장소에서 포크 PR이
# 임의 코드를 실행할 수 있어 쓸 수 없다.
#
# 그래서 방향을 바꿔, 테스트 대부분을 Unity 없이 돌 수 있게 만들었다.
# 전체 63종 중 57종이 여기서 돌고, 나머지 6종(Is.Not.AllocatingGCMemory 제약)은 Unity Test Runner의 몫이다.
jobs:
  verify:
    name: 빌드 · 테스트 · 할당 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # Unity에 의존하지 않는다는 전제를 빌드로 강제한다.
      # UnityEngine 참조가 코어에 들어오는 순간 여기서 깨진다.
      - name: Core 빌드 (Unity 비의존 검증)
        run: dotnet build .github/ci/Core.csproj -c Release --nologo -warnaserror

      # Tests/ 의 소스를 그대로 컴파일해 실행한다. 사본이 아니라 같은 파일이다.
      - name: 헤드리스 테스트 (57종)
        run: dotnet test "Tests~/StatSystem.HeadlessTests.csproj" -c Release --nologo

      # 할당이 되살아나면 여기서 실패한다. 수치를 문서에만 적어두면 낡지만, 이건 낡지 않는다.
      - name: 할당 벤치마크 (0 바이트 회귀 방지)
        run: dotnet run --project "Benchmarks~/StatAllocation.csproj" -c Release --nologo
